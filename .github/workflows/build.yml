name: Native ARM64 build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-11-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 8.0.x
      - name: Test and publish native ARM64
        shell: pwsh
        run: ./build.ps1 -Msix
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: NullTV-win-arm64
          path: |
            **/artifacts/NullTV-Setup-arm64.msi
            **/artifacts/NullTV-win-arm64.zip
            **/artifacts/NullTV-arm64.msix
          if-no-files-found: error
          retention-days: 30
